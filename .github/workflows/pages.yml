name: Trang web GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/download-releases.mjs', 'scripts/verify-update-feed.mjs', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Phát hành bản desktop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: main
      - name: Tạo danh sách tải xuống của các phiên bản đã phát hành
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp repos/${{ github.repository }}/releases > "$RUNNER_TEMP/releases.json"
          gh api repos/${{ github.repository }}/releases/latest > "$RUNNER_TEMP/latest.json"
          node scripts/download-releases.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/latest.json"
      - name: Kiểm tra script trang web
        run: |
          node --check site/player.js
          node --check site/downloads.js
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Xuất bản trang web
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Đọc lại danh sách cập nhật dùng chung cho trang web và ứng dụng
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-update-feed.mjs "$PAGE_URL"
