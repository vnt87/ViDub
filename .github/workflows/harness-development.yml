name: Kiểm tra mã nguồn YouDub Desktop

on:
  pull_request:
    branches: [main]
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      package_desktop:
        description: Dựng gói cài đặt desktop và chạy kiểm tra cài đặt
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Chất lượng và bảo mật giao diện
    needs: source-development
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Xác nhận kiểm tra hồi quy framework, giao diện và nghiệp vụ đã đạt
        env:
          MACOS_RESULT: ${{ needs.source-development.result }}
        run: test "$MACOS_RESULT" = success

  backend:
    name: Kiểm tra Host và Python
    needs: [source-development, source-development-windows]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Xác nhận kiểm tra hồi quy Host và Python trên hai nền tảng đã đạt
        env:
          MACOS_RESULT: ${{ needs.source-development.result }}
          WINDOWS_RESULT: ${{ needs.source-development-windows.result }}
        run: |
          test "$MACOS_RESULT" = success
          test "$WINDOWS_RESULT" = success

  source-development:
    name: Hồi quy mã nguồn, framework và nghiệp vụ trên macOS
    runs-on: macos-15
    timeout-minutes: 60
    env:
      LEFTHOOK: "0"
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/harness/package-lock.json
            apps/web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Đọc phạm vi mã nguồn framework sản phẩm
        run: |
          node apps/harness/framework-source.mjs
      - name: Cài phụ thuộc phát triển từ mã nguồn
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm --prefix apps/harness ci --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
          python -m venv .venv
          .venv/bin/python -m pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r backend/requirements/base.txt -r backend/requirements-test.txt
          .venv/bin/python -m nltk.downloader -e -d "$GITHUB_WORKSPACE/.cache/nltk_data" punkt_tab
          echo "NLTK_DATA=$GITHUB_WORKSPACE/.cache/nltk_data" >> "$GITHUB_ENV"
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Dựng framework và YouDub từ mã nguồn kho
        run: |
          npm run build:framework
          npm run build:youdub
          npm --prefix apps/harness run check:composition
      - name: Kiểm tra vòng đời desktop, giao diện và plugin được giữ lại
        working-directory: .cache/harness/source-build
        env:
          npm_execpath: ${{ github.workspace }}/apps/harness/node_modules/pnpm/bin/pnpm.mjs
        run: node --import ../../../apps/harness/test/source-framework.mjs node_modules/vitest/vitest.mjs run apps/desktop/tests apps/desktop-host/tests packages/client packages/host packages/api/remotes packages/api/settings-controller/tests/credentials-controller.host.spec.ts packages/boot/app-boot/tests packages/boot/plugin-manager/tests
      - name: Kiểm tra miền nghiệp vụ, giao diện và ngôn ngữ
        run: |
          npm run typecheck
          npm test
          npm run test:downloads
          npm --prefix apps/web test
          apps/web/node_modules/.bin/tsc --noEmit -p apps/web/tsconfig.json
          npm --prefix apps/harness run check:locales
      - name: Kiểm tra tích hợp Harness và hợp đồng phương tiện
        run: |
          npm --prefix apps/harness test
          .venv/bin/python -m pytest backend/tests
      - name: Đóng gói và xác minh ứng dụng macOS độc lập
        if: github.event_name == 'workflow_dispatch' && inputs.package_desktop
        env:
          # The candidate uses identity "-" (ad-hoc); Apple credentials only exist in the release job.
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          npm run package:desktop -- --dir
          node apps/harness/test/package-smoke.mjs dist/mac-arm64/YouDub.app dist/package-smoke-mac
          node apps/harness/test/package-smoke.mjs dist/mac-arm64/YouDub.app dist/package-smoke-mac-workbench --workbench
          tar -czf dist/youdub-macos-unsigned.tar.gz -C dist/mac-arm64 YouDub.app
      - name: Lưu gói ứng viên macOS và bằng chứng lần khởi động đầu
        if: github.event_name == 'workflow_dispatch' && inputs.package_desktop
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youdub-macos-unsigned
          path: |
            dist/youdub-macos-unsigned.tar.gz
            dist/package-smoke-mac/
            dist/package-smoke-mac-workbench/
          if-no-files-found: error
      - name: Lưu bằng chứng dựng từ mã nguồn
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youdub-source-build-evidence
          path: |
            .cache/harness/source-build/youdub-source-build.json
            apps/harness/dist/build-inputs.json
            apps/harness/dist/desktop/build-inputs.json
          if-no-files-found: error

  source-development-windows:
    name: Hợp đồng mã nguồn, Host và desktop trên Windows
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      LEFTHOOK: "0"
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - name: Giữ nguyên byte và liên kết mã nguồn
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global core.symlinks true
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/harness/package-lock.json
            apps/web/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Đọc phạm vi mã nguồn framework sản phẩm
        run: |
          node apps/harness/framework-source.mjs
      - name: Cài phụ thuộc mã nguồn và kiểm tra Host
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm --prefix apps/harness ci --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm --prefix apps/web ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmmirror.com
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install --index-url https://mirrors.aliyun.com/pypi/simple/ -r backend/requirements/base.txt
          echo "YOUDUB_TEST_PYTHON=$GITHUB_WORKSPACE/.venv/Scripts/python.exe" >> "$GITHUB_ENV"
      - name: Dựng bản phát triển Windows từ mã nguồn kho
        run: |
          npm run build:framework
          npm run build:youdub
          npm --prefix apps/harness run check:composition
      - name: Kiểm tra vòng đời desktop và tiến trình trên Windows
        working-directory: .cache/harness/source-build
        env:
          npm_execpath: ${{ github.workspace }}/apps/harness/node_modules/pnpm/bin/pnpm.mjs
        run: |
          node --import ../../../apps/harness/test/source-framework.mjs node_modules/vitest/vitest.mjs run apps/desktop/tests apps/desktop-host/tests packages/subprocess/subprocess-local/tests packages/boot/plugin-manager/tests/operations.spec.ts packages/boot/plugin-manager/tests/operations-process.spec.ts
      - name: Chạy Electron Host thực tế và hợp đồng sản phẩm
        run: |
          node -e "require('./apps/harness/node_modules/electron')"
          node --import ./apps/harness/test/source-framework.mjs --test apps/harness/test/desktop-host-composition.test.mjs apps/harness/test/desktop-activity.test.mjs apps/harness/test/desktop-unload.test.mjs apps/harness/test/profile.test.mjs apps/harness/test/setup-onboarding.test.mjs apps/harness/test/worker-media-paths.test.mjs
          node --import tsx --test packages/builtin/test/media-paths.test.ts packages/builtin/test/setup.test.ts
          node --test apps/harness/test/desktop-updates.test.mjs apps/harness/test/desktop-update-restart.test.mjs apps/harness/test/desktop-update-feed.test.mjs apps/harness/test/desktop-update-download.test.mjs
          npm run typecheck
          npm --prefix apps/harness run check:locales
      - name: Đóng gói và xác minh ứng dụng Windows độc lập
        if: github.event_name == 'workflow_dispatch' && inputs.package_desktop
        run: |
          npm run package:desktop -- --dir
          node apps/harness/test/package-smoke.mjs dist/win-unpacked dist/package-smoke-windows
          node apps/harness/test/package-smoke.mjs dist/win-unpacked dist/package-smoke-windows-workbench --workbench
          npm run package:desktop -- --installers-only
          node apps/harness/test/installer-smoke.mjs
          curl --fail --location --output dist/previous-YouDub-0.0.9-Setup.exe https://github.com/liuzhao1225/YouDub-webui/releases/download/v0.0.9/YouDub-0.0.9-windows-x64-Setup.exe
          echo '6ebc698bf49b3107280f17b8368c117aaee4671edaf6dfd9c24b53c443ad7c34  dist/previous-YouDub-0.0.9-Setup.exe' | sha256sum --check
          node apps/harness/test/installer-smoke.mjs --previous-installer=dist/previous-YouDub-0.0.9-Setup.exe
          cd dist
          for file in YouDub-*.exe YouDub-*.zip; do
            sha256sum "$file" > "$file.sha256"
            sha256sum --check "$file.sha256"
          done
      - name: Lưu chẩn đoán lỗi cài đặt Windows
        if: failure() && github.event_name == 'workflow_dispatch' && inputs.package_desktop
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youdub-windows-install-failure
          path: |
            dist/package-smoke-windows/
            dist/package-smoke-windows-workbench/
            dist/package-smoke-windows-installed/
            dist/package-smoke-windows-previous-upgrade/
          if-no-files-found: warn
      - name: Lưu gói cài đặt Windows và bằng chứng lần khởi động đầu
        if: github.event_name == 'workflow_dispatch' && inputs.package_desktop
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youdub-windows-release
          path: |
            dist/YouDub-*.exe
            dist/YouDub-*.zip
            dist/YouDub-*.sha256
            dist/latest.yml
            dist/latest.yml.sha256
            dist/package-smoke-windows/
            dist/package-smoke-windows-workbench/
            dist/package-smoke-windows-installed/
            dist/package-smoke-windows-previous-upgrade/
          if-no-files-found: error
      - name: Lưu bằng chứng dựng từ mã nguồn Windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youdub-windows-source-build-evidence
          path: |
            .cache/harness/source-build/youdub-source-build.json
            apps/harness/dist/build-inputs.json
            apps/harness/dist/desktop/build-inputs.json
          if-no-files-found: error
